name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run focused regression tests
        run: >-
          ./gradlew --no-daemon -DskipFormatKtlint=true
          :app:testDebugUnitTest
          --tests org.schabi.newpipe.fragments.MainFragmentTest
          --tests org.schabi.newpipe.fragments.detail.VideoDetailFragmentTest
          -x :app:runKtlint

      - name: Build debug APK
        run: ./gradlew --no-daemon -DskipFormatKtlint=true assembleDebug -x :app:runKtlint

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: YmnTube-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
